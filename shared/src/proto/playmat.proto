syntax = "proto3";
package playmat;

message ShahrazadPlayer {
    string display_name = 1;
}

message ShahrazadPlaymat {
    uint32 library = 1;
    uint32 hand = 2;
    uint32 graveyard = 3;
    uint32 battlefield = 4;
    uint32 exile = 5;
    uint32 command = 6;
    uint32 sideboard = 7;
    int32 life = 8;
    int32 mulligans = 9;
    map<uint32, int32> command_damage = 10;
    ShahrazadPlayer player = 11;
    int32 reveal_deck_top = 12;
}